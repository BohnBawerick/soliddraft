# SolidDraft's starter materials.
#
# Every value comes from a named public source, cited in each entry's `source`; the
# comment above a value gives it as the source prints it, before conversion to SI.
# A value the source does not give is left out, and stays unknown in SolidDraft.
#
# - Metals: MIL-HDBK-5J, "Metallic Materials and Elements for Aerospace Vehicle
#   Structures" (2003), a US government work in the public domain. Strengths are
#   design minimums (A-basis, or S-basis where the handbook gives only that), in the
#   longitudinal direction, at room temperature. Fcy (compressive yield) stands in
#   for compressive strength, which the handbook does not give.
# - Copper alloys: the Copper Development Association's alloy pages
#   (alloys.copper.org), typical values.
# - Woods: the USDA Wood Handbook, FPL-GTR-282 (2021), a US government work in the
#   public domain. Clear wood at 12 % moisture content; the elastic modulus is the
#   static bending modulus along the grain, compression is parallel to the grain,
#   and conductivity is across the grain.
# - Plastics, glass and generic steel: FreeCAD's material cards (CC-BY-3.0, by the
#   FreeCAD authors, github.com/FreeCAD/FreeCAD, commit 406063b1116a). For some
#   plastics the card's ultimate tensile strength is the stress at break, which is
#   below the yield stress of a plastic that necks.

format = "soliddraft-library/1"
name = "SolidDraft materials"

# Carbon and alloy steels

[[material]]
id = "steel-generic"
name = "Steel, generic"
category = "Carbon and alloy steels"
source = "FreeCAD material card Standard/Metal/Steel/Steel-Generic.FCMat (commit 406063b1116a; a blend card whose values are at the low end of the range for steels; no strengths given)"
licence = "CC-BY-3.0"
# Density: 7900 kg/m^3
density_kg_m3 = 7900
# YoungsModulus: 200000 MPa
youngs_modulus_pa = 2e11
# PoissonRatio: 0.3
poisson = 0.3
# ThermalExpansionCoefficient: 0.000012 m/m/K
thermal_expansion_per_k = 1.2e-5
# ThermalConductivity: 50 W/m/K
conductivity_w_mk = 50
# SpecificHeat: 500 J/kg/K
specific_heat_j_kgk = 500
default_appearance = "steel-machined"
hatch = "ANSI32"


name = "Oak, white"
category = "Woods"
source = "USDA Wood Handbook FPL-GTR-282 (2021), Table 5-3a (pp. 5-4 to 5-7, metric strength, 12 % MC), Table 5-2 (p. 5-3, Poisson), Table 4-7 (pp. 4-15, 4-16, conductivity), Table 4-8 (p. 4-17, heat capacity); density = SG x 1000 x 1.12 (Table 4-6a basis, 12 % MC, p. 4-13)"
# Table 5-3a specific gravity (12 % MC) printed as 0.68; density = 0.68 x 1000 x 1.12 kg/m^3
density_kg_m3 = 761.6
# Table 5-3a modulus of elasticity (static bending, 12 %) printed as 12,300 MPa
youngs_modulus_pa = 1.23e10
# Table 5-2 mu_LR (Oak, white) printed as 0.369
poisson = 0.369
# Table 5-3a compression parallel to grain (maximum crushing strength, 12 %) printed as 51,300 kPa
compressive_pa = 51300000
# Table 4-7 thermal conductivity at 12% MC, row Oak, white / White (across the grain, +/-20 %) printed as 0.19 W m-1 K-1
conductivity_w_mk = 0.19
# Table 4-8 heat capacity of solid wood at 300 K (27 C), 12% MC (all species) printed as 1.7 kJ kg-1 K-1
specific_heat_j_kgk = 1700
default_appearance = "wood-oak"


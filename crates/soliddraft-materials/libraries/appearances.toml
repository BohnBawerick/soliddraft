# SolidDraft's starter appearances: metals, anodised and painted finishes, plastics,
# rubber, glass and woods, in glTF metallic-roughness terms. Colours are sRGB. Metal
# colours follow published reflectance (F0) measurements; the rest are chosen to
# read well on screen. Written for SolidDraft and licensed with it (MIT).

format = "soliddraft-library/1"
name = "SolidDraft appearances"


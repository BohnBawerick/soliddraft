<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SolidDraft</title>
  <link rel="icon" href="data:,">
  <link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="2">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #f7f8fa; }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
    #status {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      font: 15px system-ui, sans-serif; color: #3a3f47; background: #f7f8fa; padding: 24px;
      text-align: center; white-space: pre-wrap;
    }
    #status.hidden { display: none; }
  </style>
  <script>
    // Loads the SMLib kernel's own WebAssembly module from kernel/, built separately with
    // Emscripten (docs/web.md), and defines soliddraftKernelCall for the app. The app
    // waits for soliddraftKernelReady and uses the kernel on the server when the module is
    // missing, fails, or the address has ?kernel=server.
    window.soliddraftKernelReady = (async () => {
      if (new URLSearchParams(location.search).get("kernel") === "server") return "server";
      try {
        await new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = "kernel/soliddraft-kernel-wasm.js";
          script.onload = resolve;
          script.onerror = () => reject(new Error("no kernel module"));
          document.head.appendChild(script);
        });
        const kernel = await SolidDraftKernel({ locateFile: (file) => "kernel/" + file });
        const encoder = new TextEncoder();
        window.soliddraftKernelCall = (request) => {
          const bytes = encoder.encode(request);
          const buffer = kernel._dw_alloc(bytes.length);
          kernel.HEAPU8.set(bytes, buffer);
          const reply = kernel._dw_kernel_call(buffer, bytes.length);
          const text = kernel.UTF8ToString(reply);
          kernel._dw_free_reply(reply);
          return text;
        };
        return "browser";
      } catch (e) {
        console.warn("SolidDraft: the kernel runs on the server:", e.message);
        return "server";
      }
    })();
  </script>
</head>
<body>
  <canvas id="soliddraft"></canvas>
  <div id="status" class="shown">Loading SolidDraft…</div>
</body>
</html>

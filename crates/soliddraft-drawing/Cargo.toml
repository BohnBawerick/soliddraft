[package]
name = "soliddraft-drawing"
description = "SolidDraft drawings: sheets, views, annotations and templates tied to a part."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
soliddraft-document.workspace = true
soliddraft-kernel-api.workspace = true
soliddraft-model.workspace = true
dxf = "0.6.2"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
kurbo.workspace = true
pdf-writer = "0.15.0"
serde.workspace = true
serde_json.workspace = true
subsetter = "0.2.6"
thiserror.workspace = true
toml.workspace = true
tiny-skia = { version = "0.11.4", default-features = false, features = ["std", "png-format"] }
ttf-parser = { version = "0.25.1", default-features = false, features = ["std", "opentype-layout"] }
zip.workspace = true

[dev-dependencies]
lopdf = "0.45.0"

[lints]
workspace = true

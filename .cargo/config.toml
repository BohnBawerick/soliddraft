# The kernel's WebAssembly module (crates/soliddraft-kernel-wasm) is built with Emscripten.
# C++ exceptions use WebAssembly exception handling, like Rust's panics on this target,
# and the link step needs em++ for the C++ runtime.
[target.wasm32-unknown-emscripten]
linker = "em++"
rustflags = [
    "-C", "link-arg=-fwasm-exceptions",
    "-C", "link-arg=-sALLOW_MEMORY_GROWTH=1",
    "-C", "link-arg=-sSTACK_SIZE=8388608",
]

[env]
CFLAGS_wasm32_unknown_emscripten = "-fwasm-exceptions"
CXXFLAGS_wasm32_unknown_emscripten = "-fwasm-exceptions"

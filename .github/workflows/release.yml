name: Release packages

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-packages-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/')) && github.run_id || github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release/') && !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_DEBUG: 0

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release source identity regressions
        run: python3 -m unittest discover -s packaging -p 'test_release.py'
      - id: version
        name: Validate version and release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 packaging/release.py version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/v* ]]; then
            branch=$(python3 packaging/release.py check-source "$GITHUB_REF_NAME")
            # Packages never substitute for exact-commit application checks on the release branch.
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/hosted.yml/runs?head_sha=$GITHUB_SHA&event=push&branch=$branch" \
              --jq '.workflow_runs | any(.conclusion == "success")' | grep -x true
          fi

  assemble:
    needs: plan
    uses: ./.github/workflows/packages.yml
    secrets: inherit

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [plan, assemble]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dry-run
          path: dist
      - name: Attest every downloadable file, including SBOM and checksums
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*
      - name: Publish only an explicitly pushed version tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          args=()
          title="SolidDraft $VERSION"
          if [[ "$VERSION" == 0.* ]]; then args+=(--prerelease); title="$title alpha"; fi
          gh release create "v$VERSION" dist/* --verify-tag --title "$title" \
            --notes-file dist/release-notes.md "${args[@]}"

  pages:
    if: github.event_name == 'push' && vars.SOLIDDRAFT_PAGES_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy the exact browser payload already smoke-tested
        id: deployment
        uses: actions/deploy-pages@v4

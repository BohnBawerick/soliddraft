name: Hosted CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      refresh_catallax_views:
        description: Generate the Catallax view baseline as an artifact for review
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  # Workspace test binaries must fit on GitHub-hosted runners.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

jobs:
  # Formatting and lints.
  lint:
    name: Lint (fmt, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  kernel:
    name: Catallax adapter and recipes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p soliddraft-kernel-catallax -p soliddraft-recipe --all-features --locked --no-fail-fast
      - name: Generate the requested Catallax view baseline
        if: inputs.refresh_catallax_views
        env:
          SOLIDDRAFT_BLESS: "1"
        run: cargo test -p soliddraft-cli --test view_exit_test bracket_catallax_views_match_golden_across_runs --locked -- --exact
      - uses: actions/upload-artifact@v4
        if: inputs.refresh_catallax_views
        with:
          name: catallax-view-baseline
          path: recipes/golden/catallax-views.json
          if-no-files-found: error

  # Every platform builds and tests the Catallax-only workspace from a fresh checkout.
  test:
    name: Workspace (${{ matrix.os }})
    env:
      # Workspace numeric code must share the dependency optimization level.
      CARGO_PROFILE_TEST_OPT_LEVEL: 2
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --locked --no-fail-fast

  # Catallax is compiled into the application WebAssembly module.
  web:
    name: Web build (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p soliddraft-web --target wasm32-unknown-unknown --locked

  msrv:
    name: Minimum Rust version (Rust-only crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p soliddraft-kernel-api -p soliddraft-recipe -p soliddraft-drawing -p soliddraft-sketch -p soliddraft-assistant -p soliddraft-materials -p soliddraft-assembly --all-features

  catallax-interactive:
    name: Catallax bracket (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            backend: vulkan
          - os: macos-latest
            backend: metal
    runs-on: ${{ matrix.os }}
    env:
      WGPU_BACKEND: ${{ matrix.backend }}
      SOLIDDRAFT_REQUIRE_GPU: "1"
      XDG_RUNTIME_DIR: /tmp/soliddraft-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the software Vulkan adapter
        if: runner.os == 'Linux'
        run: |
          printf 'http://archive.ubuntu.com/ubuntu\n' | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends mesa-vulkan-drivers
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
      - run: cargo test -p soliddraft-app --test catallax_exit -- --nocapture
      - run: cargo test -p soliddraft-app --test drawing_exit -- --nocapture
      - run: cargo test -p soliddraft-app --test exit_test bracket_by_hand_saved_reopened_rebuilt_and_repaired -- --nocapture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catallax-drawing-workspace-${{ matrix.os }}
          path: target/exit-test/

  application-loop:
    name: Application scenarios (MCP, viewport, kernel replay)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WGPU_BACKEND: vulkan
      XDG_RUNTIME_DIR: /tmp/soliddraft-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Read the application's pinned Catallax revision
        id: catallax
        run: |
          revision=$(sed -n 's/^pub const CATALLAX_REVISION: &str = "\(.*\)";/\1/p' crates/soliddraft-kernel-catallax/src/lib.rs)
          test -n "$revision"
          python3 - "$revision" <<'PY'
          import pathlib, sys, tomllib
          manifest = tomllib.loads(pathlib.Path("crates/soliddraft-kernel-catallax/Cargo.toml").read_text())
          dependencies = [d for d in manifest["dependencies"].values() if d.get("git", "").endswith("/catallax")]
          assert dependencies and all(d["rev"] == sys.argv[1] for d in dependencies)
          PY
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: BohnBawerick/catallax
          ref: ${{ steps.catallax.outputs.revision }}
          path: .ci-catallax
          persist-credentials: false
      - name: Install the software Vulkan adapter
        run: |
          printf 'http://archive.ubuntu.com/ubuntu\n' | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends mesa-vulkan-drivers
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
      - run: python3 -m unittest discover -s ci -p 'test_scenarios.py'
      - run: cargo build --locked -p soliddraft-cli
      - name: Build the verifier from the same pinned revision
        run: cargo build --locked --manifest-path .ci-catallax/Cargo.toml -p catallax-cli --bin catallax-verify --target-dir target
      - name: Replay the captured manual slot question
        run: |
          mkdir -p "$RUNNER_TEMP/application-loop/slot-replay"
          target/debug/catallax-verify about > "$RUNNER_TEMP/application-loop/slot-replay/about.json"
          python3 - "$RUNNER_TEMP/application-loop/slot-replay" <<'PYTHON'
          import json, pathlib, sys
          directory = pathlib.Path(sys.argv[1])
          question = json.loads(pathlib.Path("crates/soliddraft-kernel-catallax/tests/fixtures/slot-native-question.json").read_text())
          question["max_work"] = json.loads((directory / "about.json").read_text())["default_work"]
          (directory / "question.json").write_text(json.dumps(question))
          PYTHON
          target/debug/catallax-verify replay "$RUNNER_TEMP/application-loop/slot-replay/question.json" --out "$RUNNER_TEMP/application-loop/slot-replay/evidence" > "$RUNNER_TEMP/application-loop/slot-replay/response.json"
          python3 - "$RUNNER_TEMP/application-loop/slot-replay/response.json" <<'PYTHON'
          import json, sys
          response = json.load(open(sys.argv[1]))
          assert response["manifest"]["status"] == "answered", response["manifest"]
          print("Captured manual slot answered with its original geometry")
          PYTHON
      - name: Run the bracket and refusal scenarios
        run: |
          status=0
          for scenario in ci/scenarios/*.json; do
            name=$(basename "$scenario" .json)
            python3 ci/run-scenarios.py "$scenario" --soliddraft target/debug/soliddraft --catallax-verify target/debug/catallax-verify --out "$RUNNER_TEMP/application-loop/$name" || status=1
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-loop
          path: ${{ runner.temp }}/application-loop
          if-no-files-found: error
